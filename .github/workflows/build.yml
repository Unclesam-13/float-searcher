# 推送到 GitHub 后自动编译 APK。
# 编译好的安装包会出现在仓库的 Releases 页面（手机上直接点下载安装）。
name: 编译 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk HuaciAI-${{ github.run_number }}.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HuaciAI-apk
          path: HuaciAI-${{ github.run_number }}.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 划词助手 第 ${{ github.run_number }} 版
          body: 下载下面的 .apk 文件，在手机上打开安装（需要允许“安装未知来源应用”）。
          files: HuaciAI-${{ github.run_number }}.apk
